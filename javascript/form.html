<!doctype html>
<html>
  <head>
    ... <!-- linhas 4 a 17 recolhidas no vídeo (não aparecem) -->
  </head>

  <body>
    <!-- Criar um formulário para receber 3 valores
    Valor 1: nome
    Valor 2: nota 1
    Valor 3: nota 2
    Quando clicar no botão calcular:
    1 realizar o cálculo da média
    2 mostrar o resultado na tela
    Nome - média
    -->
    <h1>Calculadora de média acadêmica</h1>

    <!-- elemento de formulário com id formularioAcademico -->
    <form action="" id="formularioAcademico">
      <h2>Formulário</h2>

      <!-- Campo para capturar o nome -->
      <div>
        <!-- label: legenda de um campo -->
        <label for="nome">Digite seu nome</label>

        <!-- Campo de entrada de dados do tipo texto -->
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          required
        />
        <!-- label atributo for e input atributo name tem que ter o mesmo valor -->
      </div>
    </form>
  </body>
</html>
